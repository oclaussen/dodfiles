---
options:
  - name: profile
    default: default

env:
  AWS_PROFILE: '{{ profile }}'

exec: ['/bin/terraform']

subcommands:
  sh:
    exec: ['/bin/bash']

  tg:
    options:
      - name: profile
        default: default
    env:
      AWS_PROFILE: '{{ profile }}'

    exec: ['/bin/terragrunt']
